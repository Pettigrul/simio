[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "simio"
version = "0.1.0"
description = "Investigação de identidade digital e uso indevido de marcas."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Equipe SIMIO" }]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "google-genai>=1.30,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3",
  "playwright>=1.49,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "jinja2>=3.1,<4",
  "typer>=0.12,<1",
  "tldextract>=5.1,<6",
  "pillow>=10,<13",
  "numpy>=1.26,<3",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
simio = "simio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/simio"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH"]
ignore = [
  "S101",   # assert é normal em teste
  "RUF001", "RUF002", "RUF003",  # texto em português tem acentos e aspas que o ruff acha ambíguos
  "PTH123", # open() serve
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "ASYNC", "E501"]  # fixtures sintéticas com linhas longas
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
ignore_missing_imports = true
packages = ["simio"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "browser: precisa do Chromium do Playwright instalado",
  "live: chama serviços externos reais (Vertex AI, APIs de busca); só com SIMIO_TESTES_REAIS=1",
]
addopts = "-ra"
