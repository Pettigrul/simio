# Resolução CMN nº 4.935, de 29 de julho de 2021 — dispositivos usados no mapeamento.
#
# Texto transcrito literalmente da versão consolidada publicada pelo Banco Central do Brasil
# (API de normativos, "VersaoNormativo" 2.0), consultada em 2026-11-18:
#   https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolução CMN&numero=4935
# Atualização registrada na fonte: Resolução Conjunta BCB/CMN nº 17/2025 — revogação do art. 8º
# (dispositivo não utilizado aqui). Em vigor desde 1º/2/2022 (art. 26).
#
# Atos normativos não são objeto de proteção autoral (Lei 9.610/1998, art. 8º, IV).
# VALIDAR: a área jurídica/compliance deve revalidar a vigência antes de cada ciclo de auditoria.

fonte = "Resolução CMN nº 4.935/2021"
url_fonte = "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Resolu%C3%A7%C3%A3o%20CMN&numero=4935"
consultado_em = "2026-11-18"
nota_versao = "Versão consolidada 2.0 (art. 8º revogado pela Resolução Conjunta BCB/CMN nº 17/2025)"

[[requisito]]
id = "CMN4935-ART14-II"
citacao = "Res. CMN 4.935/2021, art. 14, inciso II"
destinatario = "Cláusula obrigatória do contrato de correspondente (obrigação do contratado decorre do contrato)"
dimensoes = ["IDENTIDADE_VISUAL", "USO_LOGO"]
hipotese = "Uso de logomarca, uso excessivo/desproporcional ou de atributos similares aos adotados pela contratante em seus canais"
texto = """Art. 14. O contrato de correspondente deve estabelecer: [...] II - vedação à utilização, pelo contratado, de logomarca ou de outros atributos que sejam similares aos adotados pela instituição contratante em suas agências, postos de atendimento, sítio eletrônico na internet, aplicativo ou outras plataformas de comunicação em rede;"""

[[requisito]]
id = "CMN4935-ART14-III"
citacao = "Res. CMN 4.935/2021, art. 14, inciso III, alíneas a e b"
destinatario = "Cláusula obrigatória do contrato de correspondente (obrigação do contratado decorre do contrato)"
dimensoes = ["TRANSPARENCIA_CORRESPONDENTE", "IDENTIDADE_COMERCIAL_DECLARADA", "CANAIS_CONTATO", "CONFUSAO_CONSUMIDOR", "LINGUAGEM_INSTITUCIONAL"]
hipotese = "Divulgação ao público da condição de prestador de serviços/parceria ausente, insuficiente, ambígua ou sem destaque"
texto = """Art. 14. O contrato de correspondente deve estabelecer: [...] III - divulgação ao público, pelo contratado, de sua condição de prestador de serviços à instituição contratante, identificada pelo nome com que é conhecida no mercado, com descrição dos produtos e serviços oferecidos e canais de contato da instituição contratante, inclusive de sua ouvidoria, em local visível, em destaque e em formato legível, por meio de: a) sítio eletrônico do correspondente na internet, acessível na página inicial; b) aplicativo e outras plataformas de comunicação em rede do correspondente; [...]"""

[[requisito]]
id = "CMN4935-ART3"
citacao = "Res. CMN 4.935/2021, art. 3º"
destinatario = "Instituição contratante"
dimensoes = ["JORNADA_ATENDIMENTO", "CANAIS_CONTATO"]
hipotese = "Atendimento ao público prestado por meio do contratado em condições que podem não seguir as diretrizes da contratante"
texto = """Art. 3º O correspondente atua por conta e sob as diretrizes da instituição contratante, que assume inteira responsabilidade pelo atendimento prestado aos clientes e usuários por meio do contratado."""

[[controle]]
id = "CMN4935-ART18"
citacao = "Res. CMN 4.935/2021, art. 18, II e § 1º"
texto = """Art. 18. [...] política de atuação e de contratação desses prestadores de serviços, prevendo, no mínimo: [...] II - mecanismos de controle de qualidade da atuação do correspondente [...]. § 1º Os mecanismos a que se refere o inciso II do caput devem conter medidas administrativas, contratualmente previstas, a serem adotadas pela instituição contratante em relação ao correspondente, aos substabelecidos e aos agentes certificados, se verificadas irregularidades ou inobservância dos padrões estabelecidos, incluindo a possibilidade de suspensão do atendimento prestado ao público e o encerramento antecipado do contrato nos casos considerados graves pela instituição contratante."""

[[controle]]
id = "CMN4935-ART19"
citacao = "Res. CMN 4.935/2021, art. 19, caput e § 1º"
texto = """Art. 19. As instituições mencionadas no art. 1º devem adequar o sistema de controles internos com o objetivo de monitorar as atividades de atendimento ao público realizadas por intermédio de correspondentes, compatibilizando-os com o volume e a complexidade das operações realizadas. § 1º A auditoria interna da instituição contratante deve avaliar, anualmente, a efetividade dos mecanismos de controle de qualidade."""

[[controle]]
id = "CMN4935-ART21"
citacao = "Res. CMN 4.935/2021, art. 21"
texto = """Art. 21. A instituição contratante deve manter atualizada a relação de seus contratados: I - na forma de dados abertos; e II - no seu sítio eletrônico na internet, acessível na página inicial e em local visível e formato legível."""
