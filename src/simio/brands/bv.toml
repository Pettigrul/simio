# Brand profile used by discovery, identity and analysis agents.
# Values marked VALIDATE must be confirmed by the operator in the corporate environment
# before production use (e.g. complete list of official domains and institution CNPJs).

id = "bv"
display_name = "Banco BV"
language = "pt-BR"

# Unambiguous brand expressions (case-insensitive, word-boundary matched).
strong_terms = ["banco bv", "bv financeira", "banco votorantim", "bv financiamentos", "bv financiamento"]
# Short/ambiguous expressions: only count with word boundaries and never alone for scoring.
weak_terms = ["bv"]

# Official institutional domains (VALIDATE: add every official domain / app link).
official_domains = ["bv.com.br"]

# Legal names / CNPJs of the institution itself. CNPJs found on third-party pages that match
# these are treated as *references to the contracting institution*, never as the page owner.
# VALIDATE: fill with the official CNPJs in the corporate environment.
institution_names = ["Banco BV", "Banco Votorantim", "BV Financeira"]
institution_cnpjs = []

# Regexes applied to the registrable domain / hostname labels.
domain_patterns = [
  '(^|[-.])bv([-.]|$)',
  'banco-?bv',
  '^bv-?(financ|credit|cred|veicul|auto|emprest|consig|digital|oficial|atendiment|sac|cartao|solar)',
  'bv-?financeira',
  'votorantim',
]

